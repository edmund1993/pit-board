<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0f12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pit Board — F1 Clash Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f12; --panel:#15181d; --panel2:#1c2027; --line:#262b33; --text:#e9ecf1; --mute:#8a93a1;
  --accent:#ff5a1f; --accent2:#ffb020; --ok:#3ddc84;
  --Common:#4e9ff5; --Rare:#ff8a24; --Epic:#b44cf0; --Legendary:#c9a37a; --Special:#6a50d0;
  --mono:'JetBrains Mono',ui-monospace,monospace; --cond:'Barlow Condensed',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0d0f12 70%,rgba(13,15,18,.92));border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;max-width:980px;margin:0 auto}
.logo{width:30px;height:30px;border-radius:7px;background:repeating-linear-gradient(45deg,#fff 0 5px,#111 5px 10px);box-shadow:0 0 0 2px var(--accent)}
h1{font-family:var(--cond);font-size:24px;letter-spacing:.04em;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.sub{color:var(--mute);font-size:12px;margin-left:auto;text-align:right}
nav{display:flex;gap:2px;max-width:980px;margin:0 auto;padding:0 10px;overflow-x:auto}
nav button{background:none;border:0;padding:10px 12px;font-family:var(--cond);font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:14px 14px 24px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-family:var(--mono);font-size:18px}
.tile small{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.bar-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.search{flex:1 1 200px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#120800;font-weight:600}
.group-h{font-family:var(--cond);font-size:18px;text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px;display:flex;justify-content:space-between;color:var(--mute)}
.group-h b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:10px;padding:10px 12px}
.card.max{background:linear-gradient(135deg,rgba(255,196,46,.07),transparent 50%),var(--panel)}
.row{display:flex;align-items:center;gap:8px}
.name{font-weight:600;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:color-mix(in srgb,var(--rc) 20%,transparent);color:var(--rc)}
.badge.s{background:var(--panel2);color:var(--mute)}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:8px}
.step{display:flex;align-items:center;background:var(--panel2);border-radius:8px;overflow:hidden}
.step button{width:32px;height:32px;border:0;background:none;font-size:18px;cursor:pointer}
.step button:active{background:var(--line)}
.lvl{font-family:var(--mono);font-weight:700;min-width:44px;text-align:center}
.amt{width:84px;background:var(--panel2);border:1px solid transparent;border-radius:8px;padding:6px 8px;font-family:var(--mono);text-align:right}
.amt:focus{outline:none;border-color:var(--accent)}
.lbl{font-size:11px;color:var(--mute)}
.prog{height:6px;background:var(--panel2);border-radius:3px;margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.prog.ready i{background:var(--ok)}
.pl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:4px;font-family:var(--mono)}
.pl .ok{color:var(--ok)}
.maxline{color:var(--Legendary);font-family:var(--mono);font-size:12px;margin-top:8px;display:flex;justify-content:space-between}
.trade{color:var(--ok)}
details{margin-top:8px}
summary{cursor:pointer;font-size:12px;color:var(--mute);list-style:none}
summary::before{content:'▸ '}
details[open] summary::before{content:'▾ '}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--mono);font-weight:500}
td:first-child,th:first-child{text-align:left;font-family:Inter,sans-serif}
th{color:var(--mute);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.up{color:var(--ok)} .dn{color:#ff6b6b}
.boost-t{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-top:6px;cursor:pointer}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.panel h2{font-family:var(--cond);font-size:20px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px}
.panel h3{font-size:13px;color:var(--mute);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.seg{display:inline-flex;background:var(--panel2);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);color:#120800;font-weight:600}
.pick{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pick:last-child{border:0}
.pick .v{font-family:var(--mono);font-weight:700}
.muted{color:var(--mute)}
.track-hero{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.track-hero .tile b{font-family:var(--cond);font-size:22px;color:var(--accent2)}
.scroll{overflow-x:auto}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#120800;font-weight:600}
.btn.warn{border-color:#5a2a2a;color:#ff8a8a}
textarea{width:100%;min-height:110px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:11px;padding:8px}
.meter{margin:10px 0}
.meter .pl{font-family:Inter,sans-serif;font-size:13px;color:var(--text)}
.big{font-family:var(--mono);font-size:40px;font-weight:700;color:var(--accent)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=date],input[type=number].f{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#03140a;padding:9px 16px;border-radius:8px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.empty{color:var(--mute);padding:30px;text-align:center}
@media(max-width:600px){.summary{grid-template-columns:repeat(2,1fr)}.sub{display:none}.grid{grid-template-columns:1fr}}
</style>
</head>

const fmt=n=>n>=1e9?(n/1e9).toFixed(n>=1e10?0:2).replace(/\.?0+$/,'')+"B":n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+"M":n>=1e3?(n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+"K":String(n);
const nfmt=n=>n.toLocaleString("en");
function known(c,l){return l>=1&&l<=c.s.length;}
function cost(c,l){ // to go from l -> l+1
  if(l<1||l>=capOf(c))return null; const k=c.ku[l],m=c.cu[l]; return k==null?null:{cards:k,coins:m};}
function toMax(c,l,a){
  if(l<1||!c.ku.length)return null;let k=0,m=0;for(let i=l;i<capOf(c);i++){k+=c.ku[i]||0;m+=c.cu[i]||0;}
  return {cards:Math.max(0,k-a),coins:m};}
const PCT=()=>1+(+S.boostPct||0)/100;
function statsAt(c,l,boosted){
  if(l<1)return null;const kl=Math.min(l,c.s.length);if(kl<1)return null;const m=boosted?PCT():1;const row=c.s[kl-1];
  if(m===1){const o={};c.sn.forEach((n,i)=>o[n]=row[i]);return {stats:o,tot:c.tot[kl-1],team:c.team[kl-1],est:kl<l};}
  // Boosted: the game rounds each boosted stat UP, and cuts pit time by the same %.
  const o={};c.sn.forEach((n,i)=>{o[n]=n==="Pit Time"?Math.round(row[i]*(2-m)*1000)/1000:(n==="Overtake M"?0:Math.ceil(row[i]*m-1e-9));});
  if("Overtake M" in o)o["Overtake M"]=(o.Impact||0)+(o.Duration||0)+(o.Recharge||0);
  let tot,team;
  if(c.k==="d"){tot=Object.values(o).reduce((a,b)=>a+b,0);team=tot;}
  else{tot=(o.Speed||0)+(o.Cornering||0)+(o["Power Unit"]||0)+(o.Qualifying||0)+(o["Overtake M"]||0);team=Math.round(tot+24.3317-28.3317*(o["Pit Time"]||0));}
  return {stats:o,tot,team,est:kl<l};}
const dlabel=k=>(D_STATS.find(x=>x[0]===k)||[k,k])[1];
const owned=c=>st(c.id).l>=1&&c.s.length>0;
let PLANNING=false; // true only while the Planner renders in "highest reachable" mode
function reach(c){ // highest level the copies on hand allow (cards only, not coins)
  let {l,a}=st(c.id),coins=0;const from=l;if(l<1)return {l,from,coins};
  while(l<capOf(c)&&c.ku[l]!=null&&c.ku[l]>0&&a>=c.ku[l]){a-=c.ku[l];coins+=c.cu[l]||0;l++;}
  return {l,from,coins};}
const pl=c=>PLANNING?reach(c).l:st(c.id).l;
function lvTxt(c){const r=reach(c);return PLANNING&&r.l>r.from?`L${r.from}→<b style="color:var(--ok)">L${r.l}</b>`:`L${st(c.id).l}`;}
function cur(c){return statsAt(c,pl(c),!!S.boosted[c.id]);}
function dStat(c,label){const k=(D_STATS.find(x=>x[1]===label)||[])[0];const s=cur(c);return s?s.stats[k]:0;}

/* ---------- UI shell ---------- */
const TABS=[["drivers","Drivers"],["parts","Parts"],["planner","Planner"],["weekly","Weekly"],["tyres","Tyres"],["boosts","Boosts"],["season","Season"],["data","Backup"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1600);}
function nav(){$("#nav").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${S.ui.tab===k?"on":""}">${l}</button>`).join("");}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.ui.tab=b.dataset.tab;save();render();window.scrollTo(0,0);};
let query="";
function render(){nav();({drivers:()=>collection("d"),parts:()=>collection("c"),planner,weekly,tyres,boosts,season,data:backup})[S.ui.tab]();}

/* ---------- collection tabs ---------- */
function collection(kind){
  const tabKey=kind==="d"?"drivers":"parts", groups=kind==="d"?D_GROUPS:C_GROUPS;
  const all=CARDS.filter(c=>c.k===kind);
  let left=0,coins=0,maxed=0,unlocked=0,surplus=0,trades=0;
  for(const c of all){const {l,a}=st(c.id);if(l>=1)unlocked++;
    if(l>=capOf(c)&&c.ku.length){maxed++;if(TRADE[c.r]){surplus+=a;trades+=Math.floor(a/TRADE[c.r]);}}
    const t=toMax(c,l,a);if(t){left+=t.cards;coins+=t.coins;}}
  const grp=S.ui.grp[tabKey]||"All";
  $("#main").innerHTML=`
  <div class="summary">
    <div class="tile"><small>Unlocked</small><b>${unlocked}/${all.length}</b></div>
    <div class="tile"><small>Maxed</small><b>${maxed}</b></div>
    <div class="tile"><small>Cards to max</small><b>${fmt(left)}</b></div>
    <div class="tile"><small>Coins to max</small><b>${fmt(coins)}</b></div>
  </div>
  ${trades?`<div class="tile" style="margin-bottom:12px"><small>Asset trade surplus</small><b class="trade">♻ ${nfmt(surplus)} cards · ${trades} trade${trades>1?"s":""} available</b></div>`:""}
  <div class="bar-tools">
    <input class="search" id="q" placeholder="Search ${tabKey}…" value="${esc(query)}">
    <button class="btn" id="addbtn">＋ Add card</button>
    <select id="sort">${[["group","Sort: Default"],["level","Level"],["ready","Ready to upgrade"],["tot","Total value"],["name","Name"],["series","Series"]].map(([v,l])=>`<option value="${v}" ${S.ui.sort===v?"selected":""}>${l}</option>`).join("")}</select>
  </div>
  <div id="addform"></div>
  <div class="chips">${["All","Owned",...groups].map(g=>`<span class="chip ${grp===g?"on":""}" data-g="${esc(g)}">${esc(g)}</span>`).join("")}</div>
  <div id="list"></div>`;
  $("#q").oninput=e=>{query=e.target.value;list(kind);};
  $("#addbtn").onclick=()=>addForm(kind);
  $("#sort").onchange=e=>{S.ui.sort=e.target.value;save();list(kind);};
  document.querySelector(".chips").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;S.ui.grp[tabKey]=c.dataset.g;save();collection(kind);};
  list(kind);
}
function list(kind){
  const tabKey=kind==="d"?"drivers":"parts",groups=kind==="d"?D_GROUPS:C_GROUPS,grp=S.ui.grp[tabKey]||"All";
  const q=query.trim().toLowerCase();
  let items=CARDS.filter(c=>c.k===kind&&(!q||c.n.toLowerCase().includes(q))&&(grp==="All"||(grp==="Owned"?st(c.id).l>0:c.g===grp)));
  const sorters={level:(a,b)=>st(b.id).l-st(a.id).l,tot:(a,b)=>((cur(b)||{tot:0}).tot-(cur(a)||{tot:0}).tot),name:(a,b)=>a.n.localeCompare(b.n),
    series:(a,b)=>(a.sr??99)-(b.sr??99),ready:(a,b)=>readyScore(b)-readyScore(a)};
  let html="";
  if(!items.length)html=`<div class="empty">Nothing matches.</div>`;
  else if(S.ui.sort==="group"){
    for(const g of groups){const gi=items.filter(c=>c.g===g);if(!gi.length)continue;
      const own=gi.filter(c=>st(c.id).l>0).length;
      html+=`<div class="group-h"><b>${esc(g)}</b><span data-gh="${esc(g)}">${own}/${gi.length} unlocked</span></div><div class="grid">${gi.map(cardHTML).join("")}</div>`;}
  } else {items.sort(sorters[S.ui.sort]);html=`<div class="grid" style="margin-top:6px">${items.map(cardHTML).join("")}</div>`;}
  const box=$("#list");box.innerHTML=html;
}
function readyScore(c){const {l,a}=st(c.id);const k=cost(c,l);return k?a/k.cards:-1;}
function cardHTML(c){
  const {l,a}=st(c.id),cap=capOf(c),isMax=l>=cap&&l>0,k=cost(c,l),rc=`var(--${c.r})`;
  const tag=c.sr?`<span class="badge s">S${c.sr}</span>`:c.av?`<span class="badge s">${c.av[0].toUpperCase()+c.av.slice(1)}+</span>`:"";
  let prog="";
  if(isMax){const sp=TRADE[c.r]?`<span class="trade">${a?`♻ ${nfmt(a)} to trade${a>=TRADE[c.r]?` (${Math.floor(a/TRADE[c.r])})`:""}`:""}</span>`:"";prog=`<div class="maxline"><span>★ MAX</span>${sp}</div>`;}
  else if(l===0)prog=`<div class="pl"><span>Locked — set level 1 when unlocked</span></div>`;
  else if(k){const p=Math.min(a/k.cards,1),ready=a>=k.cards;
    prog=`<div class="prog ${ready?"ready":""}"><i style="width:${p*100}%"></i></div><div class="pl"><span class="${ready?"ok":""}">${nfmt(a)}/${nfmt(k.cards)} cards${ready?" ✓":""}</span><span>🪙 ${fmt(k.coins)}</span></div>`;}
  else prog=`<div class="pl"><span>Upgrade costs not known yet for this card</span></div>`;
  return `<div class="card ${isMax?"max":""}" style="--rc:${rc}" data-id="${esc(c.id)}">
    <div class="row"><span class="name">${esc(c.n)}</span>${S.boosted[c.id]?`<span class="badge" style="--rc:var(--ok)">⚡+${S.boostPct}%</span>`:""}<span class="badge">${c.r}</span>${tag}${c.custom?`<span class="badge s">Custom</span>`:""}</div>
    <div class="ctrl"><div class="step"><button data-act="dn">−</button><span class="lvl">L${l}<span class="muted" style="font-size:11px">/${cap}</span></span><button data-act="up">+</button></div>
      <input class="amt" type="number" inputmode="numeric" min="0" value="${a}" data-act="amt" aria-label="cards"><span class="lbl">cards</span></div>
    ${prog}
    ${l>0?detailsHTML(c,l,a):""}
  </div>`;
}
function detailsHTML(c,l,a){
  const b=!!S.boosted[c.id],now=statsAt(c,l,b),nx=l<capOf(c)&&l+1<=c.s.length?statsAt(c,l+1,b):null,t=toMax(c,l,a),k=cost(c,l);
  if(!now)return "";
  const label=n=>c.k==="d"?dlabel(n):n;
  const rows=c.sn.map(n=>{const v=now.stats[n],w=nx?nx.stats[n]:null,d=w==null?"":(n==="Pit Time"?(w-v):(w-v));
    const dd=w==null?"":`<td class="${(n==="Pit Time"?d<0:d>0)?"up":d?"dn":"muted"}">${d>0?"+":""}${Math.round(d*100)/100||"–"}</td>`;
    return `<tr><td>${label(n)}</td><td>${v}</td>${nx?`<td>${w}</td>`+dd:""}</tr>`;}).join("");
  return `<details data-open="${c.id}"><summary>Stats & costs</summary>
    <table><tr><th>Stat</th><th>L${l}</th>${nx?`<th>L${l+1}</th><th>Δ</th>`:""}</tr>${rows}
    <tr><td><b>Total</b></td><td>${now.tot}</td>${nx?`<td>${nx.tot}</td><td class="up">+${nx.tot-now.tot}</td>`:""}</tr>
    ${c.k==="c"?`<tr><td><b>Team score</b></td><td>${now.team}</td>${nx?`<td>${nx.team}</td><td class="up">+${nx.team-now.team}</td>`:""}</tr>`:""}</table>
    ${k?`<div class="pl" style="margin-top:6px"><span>Next level: ${nfmt(k.cards)} cards · ${nfmt(k.coins)} coins</span></div>`:""}
    ${t&&l<capOf(c)?`<div class="pl"><span>To max: ${nfmt(t.cards)} more cards · ${fmt(t.coins)} coins</span></div>`:""}
    ${now.est?`<div class="pl"><span>Stats shown are L${c.s.length} (higher levels not known)</span></div>`:""}
    <label class="boost-t"><input type="checkbox" data-act="boost" ${b?"checked":""}> Boosted this week (+${S.boostPct}% stats)</label>
    ${c.custom?`<div style="margin-top:8px"><button class="btn warn" data-act="del" style="padding:4px 10px;font-size:12px">Delete this custom card</button></div>`:""}
  </details>`;
}
const openDetails=new Set();
$("#main").addEventListener("click",e=>{
  const btn=e.target.closest("[data-act]");const card=e.target.closest(".card");if(!btn||!card)return;
  const id=card.dataset.id,{l,a}=st(id);
  if(btn.dataset.act==="up")setCard(id,l+1,a);else if(btn.dataset.act==="dn")setCard(id,l-1,a);else if(btn.dataset.act==="boost"){S.boosted[id]=btn.checked;if(!btn.checked)delete S.boosted[id];save();}
  else if(btn.dataset.act==="del"){if(btn.dataset.sure){S.custom=S.custom.filter(c=>c.id!==id);delete S.cards[id];delete S.boosted[id];save();buildCards();render();return;}btn.dataset.sure=1;btn.textContent="Tap again to delete";return;}else return;
  refreshCard(card,id);
});
$("#main").addEventListener("change",e=>{const el=e.target;if(el.dataset.act!=="amt")return;const card=el.closest(".card"),id=card.dataset.id;setCard(id,st(id).l,+el.value);refreshCard(card,id);});
$("#main").addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.open){d.open?openDetails.add(d.dataset.open):openDetails.delete(d.dataset.open);}},true);
function refreshCard(card,id){
  const tmp=document.createElement("div");tmp.innerHTML=cardHTML(BY_ID[id]);const n=tmp.firstElementChild;
  const d=n.querySelector("details");if(d&&openDetails.has(id))d.open=true;
  if(!card.isConnected)card=[...document.querySelectorAll(".card")].find(x=>x.dataset.id===id);
  if(card&&!refreshCard.busy){refreshCard.busy=true;try{card.replaceWith(n);}finally{refreshCard.busy=false;}}
  const kind=BY_ID[id].k;
  const tiles=document.querySelectorAll(".summary .tile b");if(tiles.length){
    const all=CARDS.filter(c=>c.k===kind);let left=0,coins=0,maxed=0,un=0;for(const c of all){const s=st(c.id);if(s.l>=1)un++;if(s.l>=capOf(c)&&c.ku.length)maxed++;const t=toMax(c,s.l,s.a);if(t){left+=t.cards;coins+=t.coins;}}
    document.querySelectorAll('[data-gh]').forEach(el=>{const gi=CARDS.filter(c=>c.k===kind&&c.g===el.dataset.gh);el.textContent=`${gi.filter(c=>st(c.id).l>0).length}/${gi.length} unlocked`;});
    tiles[0].textContent=`${un}/${all.length}`;tiles[1].textContent=maxed;tiles[2].textContent=fmt(left);tiles[3].textContent=fmt(coins);}
}

/* ---------- planner ---------- */
/* Scoring follows the game's race rules: every stat counts, and a track's key stats get a
   performance boost on top (driver key stat +30%, car key stat +10%). */
/* ---------- scoring (agreed 13 Nov) ----------
   Car: judged as a whole car.
   - The track's key car stat counts at full value +10%, however high it goes.
   - Other stats: Speed & Cornering full value up to a threshold (default 150), then 1/4;
     Power Unit 0.3 up to 100 then 0.1; Qualifying 0.3; pit time -10 per second.
   Drivers: overall stats + 30% of the key driver stat; Race Start only counts up to the
   "perfect start" level (top-4 start), anything above it is wasted. */
const KEY_D=0.3,KEY_C=0.1;
/* Grand Prix event rules: tier limits Series for parts and season drivers; Legendary and Special
   drivers use their minimum event tier (game data). Legendaries are banned unless the event allows them. */
const TIERS=["junior","challenger","contender","champion"],TIER_MAX={junior:3,challenger:6,contender:9,champion:12},TIER_LABEL={junior:"Junior",challenger:"Challenger",contender:"Contender",champion:"Champion"};
let RULES_ON=false; // set by the Planner for views that use event rules
function eventRules(){return {on:RULES_ON&&S.ui.race==="event",tier:S.ui.tier||"champion",legend:!!S.ui.legend};}
function allowed(c){const r=eventRules();if(!r.on)return true;const ti=TIERS.indexOf(r.tier);
  if(c.k==="d"&&(c.r==="Legendary"||c.r==="Special")){if(c.r==="Legendary"&&!r.legend)return false;return c.av?TIERS.indexOf(c.av)<=ti:true;}
  return (c.sr||1)<=TIER_MAX[r.tier];}
const elig=c=>owned(c)&&allowed(c);
function rulesLabel(){const r=eventRules();return r.on?`${TIER_LABEL[r.tier]} event (Series 1–${TIER_MAX[r.tier]}) · ${r.legend?"Legendaries allowed for this tier":"no Legendaries"}`:"Series race · no restrictions";}
function MODE(){return S.ui.logic||"balanced";}
const MODE_LABEL={balanced:"Balanced",track:"Track stat first",overall:"Overall first"};
function SC(){return Object.assign({ts:150,tc:150,tpu:100,rs:110},S.ui.sc||{});}
function capv(v,t,hi,lo){return Math.min(v,t)*hi+Math.max(v-t,0)*lo;}
function rsOf(c){const s=cur(c);return s?s.stats.raceStart:0;}
function dVal(c){const s=cur(c);if(!s)return -1;return s.tot-Math.max(0,s.stats.raceStart-SC().rs);}
function dKey(c,label){return label==="Race Start"?Math.min(rsOf(c),SC().rs):dStat(c,label);}
function dScore(c,label){return dVal(c)+KEY_D*dKey(c,label);}
function driverRank(dsList,n){ // one card per driver: never the same person twice
  const m=MODE(),seen=new Set(),out=[];
  const rows=CARDS.filter(c=>c.k==="d"&&elig(c)).map(c=>{const keyRaw=dsList.reduce((a,d)=>a+dStat(c,d),0)/dsList.length,tot=cur(c).tot;
    const keys=dsList.map(d=>dKey(c,d)),bal=dVal(c)+KEY_D*keys.reduce((a,b)=>a+b,0)/dsList.length;
    const [p1,p2]=m==="track"?[keyRaw,tot]:m==="overall"?[tot,keyRaw]:[bal,keyRaw];
    return {c,keys,v:dStat(c,dsList[0]),p1,p2,sc:p1};}).sort((a,b)=>b.p1-a.p1||b.p2-a.p2);
  for(const x of rows){if(seen.has(x.c.n))continue;seen.add(x.c.n);out.push(x);if(out.length>=n)break;}
  return out;}
function bestDrivers(label,n){return driverRank([label],n);}
function partValue(c){ // team-score style value, used only as a starting point for the car search
  const s=cur(c);if(!s)return -1;const t=s.stats;
  return (t.Speed||0)+(t.Cornering||0)+(t["Power Unit"]||0)+(t.Qualifying||0)+(t["Overtake M"]||0)+24.3317-28.3317*(t["Pit Time"]||0);}
function carTotals(parts){const t={Speed:0,Cornering:0,"Power Unit":0,Qualifying:0,"Pit Time":0};for(const c of parts){if(!c)continue;const s=cur(c).stats;for(const k in t)t[k]+=s[k]||0;}return t;}
function carScore(t,kw){const sc=SC();const f=(k,v,thr,hi,lo)=>{const w=Math.min(1,kw[k]||0);return (1-w)*capv(v,thr,hi,lo)+w*(1+KEY_C)*v;};
  return f("Speed",t.Speed,sc.ts,1,0.25)+f("Cornering",t.Cornering,sc.tc,1,0.25)+f("Power Unit",t["Power Unit"],sc.tpu,0.3,0.1)+f("Qualifying",t.Qualifying,1e9,0.3,0.3)-10*t["Pit Time"];}
function optimizeCar(kw){const m=MODE();if(m==="balanced")return optimizeCarBal(kw);
  const keyStat=c=>Object.keys(kw).reduce((a,k)=>a+(kw[k]||0)*(cur(c).stats[k]||0),0);
  const lo=C_GROUPS.map(g=>{const o=CARDS.filter(c=>c.k==="c"&&c.g===g&&elig(c));
    o.sort((x,y)=>m==="track"?(keyStat(y)-keyStat(x)||partValue(y)-partValue(x)):(partValue(y)-partValue(x)||keyStat(y)-keyStat(x)));return {g,c:o[0]||null};});
  return {lo,score:null};}
function optimizeCarBal(kw){ // coordinate search over one part per category, from two starting cars
  const opts=C_GROUPS.map(g=>CARDS.filter(c=>c.k==="c"&&c.g===g&&elig(c)));
  const run=start=>{let pick=start.slice(),best=carScore(carTotals(pick),kw);
    for(let pass=0;pass<12;pass++){let changed=false;
      opts.forEach((o,i)=>{for(const c of o){if(c===pick[i])continue;const t=pick.slice();t[i]=c;const v=carScore(carTotals(t),kw);if(v>best+1e-9){best=v;pick=t;changed=true;}}});
      if(!changed)break;}
    return {pick,best};};
  const keyStat=c=>Object.keys(kw).reduce((a,k)=>a+(kw[k]||0)*(cur(c).stats[k]||0),0);
  const a=run(opts.map(o=>o.slice().sort((x,y)=>partValue(y)-partValue(x))[0]||null));
  const b=run(opts.map(o=>o.slice().sort((x,y)=>keyStat(y)-keyStat(x)||partValue(y)-partValue(x))[0]||null));
  const r=b.best>a.best?b:a;return {lo:C_GROUPS.map((g,i)=>({g,c:r.pick[i]})),score:r.best};}
function loadoutHTML(kw){
  const {lo,score}=optimizeCar(kw),keys=Object.keys(kw).filter(k=>kw[k]>0),agg=carTotals(lo.map(x=>x.c));let tot=0,team=0;
  for(const {c} of lo){if(!c)continue;const s=cur(c);tot+=s.tot;team+=s.team;}
  const sh=a=>a.replace("Power Unit","PU").replace("Qualifying","Qual").replace("Cornering","Cor").replace("Speed","Spd");
  return `<div>${lo.map(({g,c})=>`<div class="pick"><span><span class="muted">${g}</span><br>${c?`<b>${esc(c.n)}</b> <span class="badge" style="--rc:var(--${c.r})">${c.r}</span> <span class="muted">${lvTxt(c)}</span>`:`<span class="muted">${eventRules().on&&CARDS.some(x=>x.k==="c"&&x.g===g&&owned(x))?"Not available at this tier":"No part owned"}</span>`}</span><span class="v" style="font-weight:500;font-size:12px;text-align:right">${c?C_ATTRS.map(a=>`<span style="${keys.includes(a)?"color:var(--accent2);font-weight:700":""}">${sh(a)} ${cur(c).stats[a]||0}</span>`).join(" · "):"–"}</span></div>`).join("")}</div>
  <h3>Car totals</h3><div class="summary">${C_ATTRS.map(a=>`<div class="tile" style="${keys.includes(a)?"border-color:var(--accent)":""}"><small>${a}${keys.includes(a)?" · key":""}</small><b>${Math.round(agg[a])}</b></div>`).join("")}</div>
  <div class="muted" style="font-size:12px">${score==null?MODE_LABEL[MODE()]:"Car score "+score.toFixed(1)} · Pit time ${agg["Pit Time"].toFixed(2)}s · Total ${tot} · Team score ${team}</div>
  ${PLANNING?(()=>{const k=lo.reduce((t,{c})=>t+(c?reach(c).coins:0),0);return k?`<div class="tile" style="margin-top:10px"><small>Coins to upgrade these parts to the levels shown</small><b>${nfmt(k)}</b></div>`:"";})():""}`;
}
/* boosts: driver stats count in full (Race Start only up to the perfect-start level for the chosen drivers),
   +30% on the key driver stat; car stats are valued by how much they actually raise the car score. */
function boostValue(b,dsList,drivers,kw,carT){
  const sc=SC();let v=0;const n=dsList.length;
  for(const [k,val] of Object.entries(b.b)){
    const dk=(D_STATS.find(x=>x[1]===k)||[])[0];
    if(dk){let add=val;if(k==="Race Start"&&drivers.length)add=drivers.reduce((a,c)=>a+Math.min(val,Math.max(0,sc.rs-rsOf(c))),0)/drivers.length;
      v+=add*(1+KEY_D*dsList.filter(d=>d===k).length/n);}
  }
  const t2=Object.assign({},carT);let carBit=false;for(const k of C_ATTRS)if(b.b[k]){t2[k]+=b.b[k];carBit=true;}
  if(carBit)v+=carScore(t2,kw)-carScore(carT,kw);
  return v;}
function rankBoosts(dsList,drivers,kw,n){const own=BOOSTS.filter(b=>(S.boostOwned[b.n]||0)>0);const pool=own.length?own:BOOSTS;
  const carT=carTotals(optimizeCar(kw).lo.map(x=>x.c));
  const m=MODE(),dk=b=>dsList.reduce((a,d)=>a+(b.b[d]||0),0)/dsList.length,ck=b=>Object.keys(kw).reduce((a,k)=>a+(kw[k]||0)*(b.b[k]||0),0);
  const rows=pool.map(b=>{const [p1,p2]=m==="track"?[dk(b),ck(b)]:m==="overall"?[b.t,dk(b)]:[boostValue(b,dsList,drivers,kw,carT),0];return {b,sc:p1,p2};});
  return {own:!!own.length,list:rows.sort((x,y)=>y.sc-x.sc||y.p2-x.p2).slice(0,n)};}
function logicNote(ctx,ds,cs){const m=MODE(),L=x=>x==="Tyre Use"?"Tyre Mgmt":x;
  if(m==="track")return ctx==="loadout"?"Track stat first: each slot takes the part with the most of the stats you pick (ties: higher overall). Pick none to rank by overall.":
    `Track stat first (resource-sheet style): drivers with the most ${ctx==="track"?L(ds):"of the week's key driver stats"}, parts with the most ${ctx==="track"?cs:"of the week's key car stats"}; ties go to the higher overall. Right-hand number = key stat.`;
  if(m==="overall")return ctx==="loadout"?"Overall first: each slot takes the part with the highest overall value (stats + pit time); your picked stats only break ties.":
    `Overall first: drivers and parts with the highest total stats; the ${ctx==="track"?"track's":"week's"} key stats only break ties. Right-hand number = total.`;
  if(ctx==="loadout")return "Balanced: the stats you pick count in full (+10%); the rest count up to their \"enough\" level. Pick none for the best all-round car.";
  if(ctx==="track")return `Balanced: drivers = overall stats + 30% of ${L(ds)}${ds==="Race Start"?" (counted only up to a perfect start)":""}; car: ${cs} counts in full +10%, other stats up to their "enough" level. Right-hand number = driver score.`;
  return "Balanced: drivers = overall stats + 30% of the week's key driver stat (Race Start only up to a perfect start); car: the week's key car stats count in full +10% (shared across the tracks), other stats up to their \"enough\" level.";}
function scoringSettings(){const s=SC();return `<details class="panel" style="padding:10px 14px" id="scset"><summary>Scoring settings</summary>
  <p class="muted" style="font-size:12px">"Enough" levels for the whole car. Above them a stat counts at a quarter (Power Unit: 0.3 → 0.1). The track's key stat always counts in full +10%. Race Start above the perfect-start level is ignored.</p>
  <div class="flex">${[["ts","Speed enough at"],["tc","Cornering enough at"],["tpu","Power Unit enough at"],["rs","Perfect start at Race Start"]].map(([k,l])=>`<label class="lbl">${l}<br><input class="f" type="number" data-sc="${k}" value="${s[k]}" style="width:80px"></label>`).join("")}
  <button class="btn" id="screset" style="align-self:flex-end">Defaults</button></div></details>`;}

/* ---------- tyres ----------
   Wear per lap (%) = trackFigure x driverFactor(TyreMgmt) / range(km) x 100
   - range: the game's tyre range for that track, compound and driving style
   - trackFigure: measured for a Tyre Mgmt 80 driver (your calibration > built-in > rough estimate)
   - driverFactor: 1.20 at 50, 1.00 at 80, 0.97 at 89, 0.95 at 95 (measured); straight-line beyond */
const T_COMP=[["S","Soft"],["M","Medium"],["H","Hard"],["W","Wet"]],T_STYLE=["Attack","Neutral","Conserve"];
const TM_PTS=[[50,1.20],[80,1.00],[89,0.97],[95,0.95]];
function tmFactor(tm){const P=TM_PTS;if(tm<=P[0][0])return P[0][1]+(P[0][0]-tm)*(P[0][1]-P[1][1])/(P[1][0]-P[0][0]);
  for(let i=0;i<P.length-1;i++){const[a,fa]=P[i],[b,fb]=P[i+1];if(tm<=b)return fa+(tm-a)*(fb-fa)/(b-a);}
  const[a,fa]=P[P.length-2],[b,fb]=P[P.length-1];return Math.max(0.75,fb+(tm-b)*(fb-fa)/(b-a));}
function trackFig(tr){const c=(S.tyreCal||{})[tr];if(c&&c.k)return {k:c.k,src:"you",note:`calibrated by you ${c.date||""}`};
  const d=TYRES[tr];if(d.k)return {k:d.k,src:"measured",note:"measured in real races"};
  return {k:+(0.243*d.len).toFixed(2),src:"est",note:"not measured yet: rough estimate"};}
function drvTM(c){const s=cur(c);return s?s.stats.tyreUse:0;}
function wear(tr,comp,style,tm){const d=TYRES[tr];const r=d.r[comp][T_STYLE.indexOf(style)];return trackFig(tr).k*tmFactor(tm)/r*100;}
function tyreMargin(tr){return trackFig(tr).src==="est"?10:5;} // keep 10% on estimates, 5% on measured/calibrated tracks
function tyreLaps(tr){const u=S.tyreUi||{};return (u.laps&&u.laps[tr])||TYRES[tr].laps;}
function tyrePlans(tr,laps,tm,wet){
  const comps=wet?["W"]:["S","M","H"],d=TYRES[tr],out=[],lim=100-tyreMargin(tr);
  const stint=(c,n)=>({c,n,used:wear(tr,c,"Neutral",tm)*n,att:wear(tr,c,"Attack",tm)-wear(tr,c,"Neutral",tm)});
  const rec=(left,acc)=>{ if(acc.length>3)return; if(left===0){out.push(acc.slice());return;}
    for(const c of comps)for(let n=(laps>=4&&left>=2?2:1);n<=left;n++){const s=stint(c,n);if(s.used>98)break;acc.push(s);rec(left-n,acc);acc.pop();}};
  rec(laps,[]);
  const lt=c=>d.lt[c]||0;
  for(const p of out){p.stops=p.length-1;p.time=p.reduce((t,s)=>t+lt(s.c)*s.n,0);p.near=p.some(s=>s.used>lim);
    p.attack=p.near?0:p.reduce((t,s)=>t+Math.min(s.n,Math.max(0,Math.floor((lim-s.used)/Math.max(s.att,0.1)))),0);}
  // fewest stops first, then quickest on paper; drop duplicates that are just reorderings
  const seen=new Set();const uniq=out.sort((a,b)=>a.stops-b.stops||a.time-b.time).filter(p=>{const k=p.map(s=>s.c+s.n).sort().join();if(seen.has(k))return false;seen.add(k);return true;});
  const ok=uniq.filter(p=>!p.near).slice(0,6),best=ok[0];
  // near-misses: only worth showing if they need fewer stops or are quicker than the best safe plan
  const near=uniq.filter(p=>p.near&&(!best||p.stops<best.stops||(p.stops===best.stops&&p.time<best.time-0.5))).slice(0,2);
  ok.lim=lim;ok.near=near;return ok;}
const T_NAME=c=>T_COMP.find(x=>x[0]===c)[1];
function planText(p){return p.map(s=>`${T_NAME(s.c)} ${s.n}`).join(" → ");}
function planNote(p){return `${p.stops} stop${p.stops===1?"":"s"} · tyre left at each stop/finish: ${p.map(s=>Math.round(100-s.used)+"%").join(", ")}`+(p.near?" · <span class=\"dn\">Neutral only — an Attack lap will run you to 0</span>":` · room for about ${p.attack} Attack lap${p.attack===1?"":"s"}`);}
function tyreBadge(tr){const tf=trackFig(tr);return tf.src==="est"?`<span class="badge" style="--rc:#ff6b6b">ESTIMATE</span>`:`<span class="badge" style="--rc:var(--ok)">${tf.src==="you"?"YOUR CALIBRATION":"MEASURED"}</span>`;}
/* tyre strategy inside the Planner */
function tyreBox(tr,cs){
  cs=cs.filter(Boolean);if(!TYRES[tr]||!cs.length)return"";const laps=tyreLaps(tr);
  const rows=cs.map(c=>{const ps=tyrePlans(tr,laps,drvTM(c),false);const show=[...ps.slice(0,2),...ps.near.slice(0,1)];
    return `<div class="muted" style="font-size:12px;margin-top:6px"><b style="color:var(--tx)">${esc(c.n)}</b> · Tyre Mgmt ${drvTM(c)}</div>`+(show.length?show.map((p,i)=>`<div class="pick"><span><b>${planText(p)}</b>${p.near?' <span class="badge" style="--rc:#ff6b6b">RISKY</span>':""}<br><span class="muted" style="font-size:11.5px">${planNote(p)}</span></span><span class="v">${i===0&&!p.near?"★":""}</span></div>`).join(""):`<div class="muted">No plan reaches the finish; add a stop or use Conserve.</div>`);}).join("");
  return `<h3>Tyre strategy · ${esc(tr)} ${tyreBadge(tr)}</h3>
  <div class="flex"><label class="lbl">Race laps <input class="f" type="number" min="1" max="20" data-tl="${esc(tr)}" value="${laps}" style="width:60px"></label>
  <button class="btn" data-ot="${esc(tr)}" data-d="${esc(cs.map(c=>c.id).join("|"))}" style="padding:4px 10px;font-size:12px">Open in Tyres</button>
  <span class="muted" style="font-size:11.5px">Dry, Neutral. Keeps ${tyreMargin(tr)}% in hand${trackFig(tr).src==="est"?" (estimate — not measured yet)":""}.</span></div>${rows}`;}
function tyreLine(x,cs){ // one line for This week
  cs=cs.filter(Boolean);if(!TYRES[x]||!cs.length)return"";const c=cs.slice().sort((a,b)=>drvTM(a)-drvTM(b))[0];
  const ps=tyrePlans(x,tyreLaps(x),drvTM(c),false),p=ps[0]||ps.near[0];
  return `<div class="pick"><span><b>${esc(x)}</b> ${tyreBadge(x)} <span class="muted" style="font-size:11.5px">${tyreLaps(x)} laps</span><br>${p?`<b>${planText(p)}</b>${p.near?' <span class="badge" style="--rc:#ff6b6b">RISKY</span>':""}<br><span class="muted" style="font-size:11.5px">${planNote(p)} · for ${esc(c.n)} (lower Tyre Mgmt)</span>`:'<span class="muted">No plan reaches the finish</span>'}</span>
  <button class="btn" data-ot="${esc(x)}" data-d="${esc(cs.map(c=>c.id).join("|"))}" style="padding:4px 10px;font-size:12px">Tyres</button></div>`;}
function tyreHooks(){
  document.querySelectorAll("[data-tl]").forEach(el=>el.onchange=e=>{const u=S.tyreUi=S.tyreUi||{};u.laps=u.laps||{};const t=el.dataset.tl;u.laps[t]=Math.max(1,Math.min(20,+e.target.value||TYRES[t].laps));save();render();});
  document.querySelectorAll("[data-ot]").forEach(el=>el.onclick=()=>{const u=S.tyreUi=S.tyreUi||{};u.track=el.dataset.ot;const ids=el.dataset.d.split("|");u.drv=[ids[0],ids[1]||ids[0]];u.wet=false;S.ui.tab="tyres";save();render();window.scrollTo(0,0);});
}
function tyres(){
  const u=S.tyreUi=S.tyreUi||{};const tracks=Object.keys(TYRES).sort((a,b)=>a.localeCompare(b));
  const tr=u.track&&TYRES[u.track]?u.track:"Melbourne";const d=TYRES[tr];

  const badge=tyreBadge(tr);
  const lifeTable=c=>{if(!c)return"";const tm=drvTM(c);return `<h3>${esc(c.n)} · Tyre Mgmt ${tm} <span class="muted" style="text-transform:none">(wear ×${tmFactor(tm).toFixed(2)} vs an 80 driver)</span></h3>
    <div class="scroll"><table><tr><th>Tyre</th>${T_STYLE.map(s=>`<th>${s}</th>`).join("")}<th>Laps on Neutral</th></tr>
    ${T_COMP.map(([k,n])=>`<tr><td>${n}</td>${T_STYLE.map(s=>`<td>${wear(tr,k,s,tm).toFixed(0)}%</td>`).join("")}<td><b>${(100/wear(tr,k,"Neutral",tm)).toFixed(1)}</b></td></tr>`).join("")}</table></div>`;};
  const planHTML=c=>{if(!c)return"";const ps=tyrePlans(tr,laps,drvTM(c),wet);
    const row=(p,i)=>`<div class="pick"><span><b>${planText(p)}</b>${p.near?' <span class="badge" style="--rc:#ff6b6b">RISKY</span>':""}<br><span class="muted" style="font-size:11.5px">${planNote(p)}</span></span><span class="v">${i===0&&!p.near?"★":""}</span></div>`;
    return `<h3>Pit plans · ${esc(c.n)}</h3>${ps.length?ps.map(row).join(""):`<div class="muted">No plan keeps ${tyreMargin(tr)}% in hand at every stop; consider Conserve laps or an extra stop.</div>`}${ps.near.length?`<div class="muted" style="font-size:11.5px;margin-top:6px">Faster but below the ${tyreMargin(tr)}% margin:</div>${ps.near.map(p=>row(p,1)).join("")}`:""}`;};
  $("#main").innerHTML=`<div class="panel"><h2>Tyres</h2>

      <label class="lbl">Race laps<br><input class="f" type="number" id="tlaps" min="1" max="20" value="${laps}" style="width:70px"></label>

    <div class="tile" style="margin-top:10px"><small>Track figure (Tyre Mgmt 80)</small><b>${tf.k.toFixed(2)} ${badge}</b><span class="muted" style="font-size:12px">${tf.note}${tf.src==="est"?" — could be up to 1.8× off (Las Vegas and Madrid were). Run one full Neutral lap and calibrate below.":""}</span></div>
    ${lifeTable(d1)}${lifeTable(d2)}
    <p class="muted" style="font-size:12px">Wear per lap. Driving style changes wear by about ±10%; boosts don't change wear unless they add Tyre Mgmt. Pit before 0% — worn tyres drop to ${Math.round(d.worn*100)}% top speed here.</p></div>
  <div class="panel">${planHTML(d1)}${d2&&d2.id!==d1.id?planHTML(d2):""}

  <div class="panel"><h2>Calibrate this track</h2>

    ${((S.tyreCal||{})[tr]||{}).log?(()=>{const L=S.tyreCal[tr].log,nb=L.filter(e=>e.boostTU).length;return `<p class="muted" style="font-size:12px">${L.length} lap${L.length>1?"s":""} saved for ${esc(tr)} — the latest lap without a Tyre Use boost sets the figure.${nb?` ${nb} lap${nb>1?"s":""} with a Tyre Use boost equipped ${nb>1?"are":"is"} kept for comparison only.`:""}</p>`;})():""}
    <p class="muted" style="font-size:11.5px">Pick the boost you equipped (it's on for the whole race). Boosts without Tyre Use don't change wear; laps with a Tyre Use boost are logged separately until we know how much they save. Overtake Mode doesn't change wear.</p>

  $("#csave").onclick=()=>{const c=BY_ID[$("#cd").value],comp=$("#cc").value,st=$("#cs").value,b=+$("#cb").value,a=+$("#ca").value;

function tyreCount(){return Object.keys(S.tyreCal||{}).length;}

/* ---------- season ---------- */
function season(){
  const s=S.season,start=new Date(s.start),end=new Date(s.end),now=new Date();
  const total=end-start,el=Math.min(Math.max(now-start,0),total),left=Math.max(0,Math.ceil((end-now)/864e5));
  const meter=(label,v,t)=>`<div class="meter"><div class="pl"><span>${label}</span><span class="muted">${nfmt(v)} / ${nfmt(t)} · ${t?Math.round(v/t*100):0}%</span></div><div class="prog"><i style="width:${t?v/t*100:0}%"></i></div></div>`;
  const cnt=k=>{const cs=CARDS.filter(c=>c.k===k);let un=0,up=0,upT=0;for(const c of cs){const l=st(c.id).l;if(l>0)un++;up+=Math.max(0,l-1);upT+=capOf(c)-1;}return {un,n:cs.length,up,upT};};
  const d=cnt("d"),p=cnt("c");
  let coinsLeft=0;for(const c of CARDS){const {l,a}=st(c.id);const t=toMax(c,l,a);if(t)coinsLeft+=t.coins;}
  $("#main").innerHTML=`<div class="panel"><h2>Season</h2>
    <div class="flex"><div><div class="big">${left}</div><div class="muted">days left</div></div>
    <div class="flex" style="margin-left:auto"><label class="lbl">Start<br><input type="date" id="ss" value="${s.start}"></label><label class="lbl">End<br><input type="date" id="se" value="${s.end}"></label></div></div>
    ${meter("Season elapsed",Math.round(el/864e5),Math.round(total/864e5))}</div>
  <div class="panel"><h2>Collection</h2>
    ${meter("Drivers unlocked",d.un,d.n)}${meter("Driver level-ups",d.up,d.upT)}${meter("Parts unlocked",p.un,p.n)}${meter("Part level-ups",p.up,p.upT)}
    <div class="muted" style="margin-top:8px">Coins still needed to max everything you've unlocked: <b style="color:var(--text)">${fmt(coinsLeft)}</b></div></div>`;
  $("#ss").onchange=e=>{S.season.start=e.target.value;save();season();};$("#se").onchange=e=>{S.season.end=e.target.value;save();season();};
}

/* ---------- backup ---------- */
function backup(){
  $("#main").innerHTML=`<div class="panel"><h2>Backup</h2>
  <p class="muted" style="margin-top:0">Your data is saved in this browser only. To move it to another phone or browser, copy the backup code here and paste it there.</p>
  <div class="flex"><button class="btn pri" id="cp">Copy backup code</button><button class="btn" id="tcp2">Copy tyre data only</button></div>
  <h3>Restore</h3><textarea id="ta" placeholder="Paste a backup code here…"></textarea>
  <div class="flex" style="margin-top:8px"><button class="btn" id="im">Restore from code</button><label class="btn">Load .json file<input type="file" id="fi" accept=".json,application/json" hidden></label></div>
  ${Object.keys(SEED.cards).length?`<h3>Your resource sheet</h3>
  <p class="muted" style="margin-top:0">Levels and card counts were loaded from your Google Sheet and game screenshots (latest ${SEED.date}). Reloading replaces what's here with those numbers.</p>
  <button class="btn" id="rl">Reload levels from sheet</button>`:""}
  <h3>Start over</h3><button class="btn warn" id="rs">Reset all data</button><span id="rsc"></span></div>
  <div class="panel"><h2>About & credits</h2>
    <p style="margin-top:0">Pit Board was inspired by <a href="https://rmlrace.github.io/pitwall-companion/" style="color:var(--accent2)">PitWall Companion</a> — the original companion app, and the first source of the track key stats.</p>
    <p>Thanks to the <b>F1 Clash 2026 Resource Sheet v1.0 by TR The Flash</b> — the starting card levels, the team-score formula and many layout ideas came from it.</p></div>`;
  $("#cp").onclick=async()=>{const code=JSON.stringify({app:"pitboard",v:1,data:S});try{await navigator.clipboard.writeText(code);toast("Backup copied");}catch(e){$("#ta").value=code;$("#ta").select();toast("Select and copy the text below");}};
  const restore=txt=>{try{let o=JSON.parse(txt);if(o&&o.app==="pitboard-tyres"){toast("That's a tyre data code, not a backup — nothing was changed");return;}o=o.data||o;if(!o.cards)throw 0;S=merge(structuredClone(DEF_STATE),o);S.ui.tab="data";save();buildCards();toast("Restored");render();}catch(e){toast("That code didn't work");}};
  $("#im").onclick=()=>restore($("#ta").value);
  $("#tcp2").onclick=()=>copyTyres($("#ta"));
  $("#fi").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(restore);};
  if($("#rl"))$("#rl").onclick=e=>{const b=e.target;if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Tap again to replace your levels";return;}seeded(S);save();toast("Levels reloaded");render();};
  $("#rs").onclick=()=>{$("#rsc").innerHTML=` <button class="btn warn" id="rs2">Yes, erase everything</button>`;$("#rs2").onclick=()=>{S=structuredClone(DEF_STATE);S.dataV=DATA_V;S.ui.tab="data";save();buildCards();toast("Reset");render();};};
}
render();
</script>
<script>try{if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");}catch(e){}</script>
</body>
</html>
